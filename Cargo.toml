[package]
name = "rplayer"
version = "0.5.0-alpha"
edition = "2021"
build = "build.rs"
description = "Reproductor de video y audio libre"
license = "MIT"
rust-version = "1.82"

[[bin]]
name = "rplayer"
path = "src/main.rs"

[dependencies]
# UI
dioxus = { version = "0.7.10", features = ["desktop"] }

# Media backend
libmpv2 = { version = "5", features = ["render"] }
libmpv2-sys = "4.0.1"

# GL proc-address
libloading = "0.8"

# Native file dialog. GTK3 backend (not xdg-portal): we already require GTK3
# directly for X11 video embedding, we don't run sandboxed (no Flatpak), and
# xdg-portal's ashpd/zbus chain needs a runtime feature (tokio/async-std) that
# nothing else in the tree provides after the Dioxus 0.7 (wry 0.53) bump.
rfd = { version = "0.14", default-features = false, features = ["async-std", "xdg-portal"] }

# Open URLs in browser
open = "5"

# Config and persistence
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"

# Communication between threads
crossbeam-channel = "0.5"
futures-util = "0.3"

# Remote HTTP and Last.fm
tiny_http = "0.12"
ureq = { version = "2", features = [] }

# Hashing (Last.fm signature, file identity)
md5 = "0.7"

# Find executables in PATH (ffmpeg, yt-dlp)
which = "6"

# time
chrono = { version = "0.4", features = ["serde"] }

# Logging
log = "0.4"
env_logger = "0.11"

# Obfuscation of sensitive strings in the binary (API keys, internal URLs)
obfstr = "0.4"

# Image for thumbnails
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
base64 = "0.22"

# RSS/XML for podcasts
quick-xml = "0.41"
tracing-subscriber = "0.3.23"
tracing = "0.1.44"

[profile.release]
opt-level = 3
lto = true            # Link-time optimization: more compact and less analyzeable binary
codegen-units = 1     # A single chunk: less visible structural information
strip = true          # Remove function names, source code paths, debug symbols
panic = "abort"       # Remove panic messages that include .rs file names
overflow-checks = false

[profile.dev]
opt-level = 1

[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3", features = ["libloaderapi", "wingdi", "winuser"] }

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
gdk = "0.18"
gdkx11 = "0.18"
glib = "0.18"
