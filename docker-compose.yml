# RPlayer — docker-compose.yml
#
# PURPOSE: build and CI/CD only. Not for running the player.
# The player requires a display, OpenGL, and host audio.
#
# Useful commands:
#
#   Build for Linux (Fedora):
#     docker compose run --rm build-linux
#
#   Build for Linux (Ubuntu, better compatibility):
#     docker compose run --rm build-ubuntu
#
#   Run lint and check:
#     docker compose run --rm lint
#
#   Run tests:
#     docker compose run --rm test
#
#   View build logs:
#     docker compose run --rm build-linux 2>&1 | tee build.log
#
# The resulting binary ends up in ./artifacts/rplayer

version: "3.9"

# ── Shared volumes ──────────────────────────────────────────────────
volumes:
  cargo-cache:
    driver: local
  registry-cache:
    driver: local

# ── Shared base configuration ──────────────────────────────────────────
x-build-common: &build-common
  working_dir: /workspace
  volumes:
    - .:/workspace
    - ./artifacts:/out
    - cargo-cache:/usr/local/cargo/registry
    - registry-cache:/usr/local/cargo/git
  environment:
    - RUST_LOG=warn
    - CARGO_TERM_COLOR=always
    - CARGO_INCREMENTAL=0

# ── Services ──────────────────────────────────────────────────────────────
services:

  # ── Fedora build (main development environment) ──────────────────────
  build-linux:
    <<: *build-common
    build:
      context: .
      dockerfile: Dockerfile
      target: builder-ubuntu  # Ubuntu has better binary compatibility
    command: >
      sh -c "
        set -e &&
        echo '=== Building RPlayer ===' &&
        cargo build --release &&
        cp target/release/rplayer /out/rplayer &&
        echo '=== Build complete: /out/rplayer ===' &&
        ls -lh /out/rplayer
      "

  # ── Ubuntu build (maximum glibc compatibility) ───────────────────────
  build-ubuntu:
    <<: *build-common
    image: ubuntu:22.04
    environment:
      - DEBIAN_FRONTEND=noninteractive
      - RUST_LOG=warn
      - CARGO_TERM_COLOR=always
    volumes:
      - .:/workspace
      - ./artifacts:/out
      - cargo-cache:/root/.cargo/registry
    command: >
      sh -c "
        apt-get update -qq &&
        apt-get install -y -qq curl gcc pkg-config libmpv-dev libssl-dev
          libx11-dev libxcursor-dev libxrandr-dev libxi-dev libgl1-mesa-dev &&
        curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y -q &&
        . /root/.cargo/env &&
        cd /workspace &&
        cargo build --release &&
        cp target/release/rplayer /out/rplayer-ubuntu
      "

  # ── Lint (clippy + fmt check) ───────────────────────────────────────────
  lint:
    <<: *build-common
    build:
      context: .
      dockerfile: Dockerfile
      target: rust-base
    command: >
      sh -c "
        set -e &&
        echo '=== cargo fmt --check ===' &&
        cargo fmt --check &&
        echo '=== cargo clippy ===' &&
        cargo clippy -- -D warnings &&
        echo '=== Lint OK ==='
      "

  # ── Check (faster than a full build) ───────────────────────────────
  check:
    <<: *build-common
    build:
      context: .
      dockerfile: Dockerfile
      target: rust-base
    command: cargo check --all

  # ── Tests ───────────────────────────────────────────────────────────────
  test:
    <<: *build-common
    build:
      context: .
      dockerfile: Dockerfile
      target: rust-base
    command: cargo test --all

  # ── Interactive shell (debugging the build environment) ──────────────────
  shell:
    <<: *build-common
    build:
      context: .
      dockerfile: Dockerfile
      target: rust-base
    stdin_open: true
    tty: true
    command: bash
