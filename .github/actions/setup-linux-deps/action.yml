name: Setup Linux build dependencies
description: Installs the apt packages RPlayer needs to build on Ubuntu (libmpv, X11, GTK3/WebKitGTK for Dioxus Desktop)
runs:
  using: composite
  steps:
    - name: Install system dependencies
      shell: bash
      run: |
        sudo apt-get update -qq
        sudo apt-get install -y \
          libmpv-dev \
          pkg-config \
          libssl-dev \
          libx11-dev \
          libxcursor-dev \
          libxrandr-dev \
          libxi-dev \
          libgl1-mesa-dev \
          libgtk-3-dev \
          libwebkit2gtk-4.1-dev \
          libsoup-3.0-dev \
          libgdk-pixbuf-2.0-dev \
          libxdo-dev
